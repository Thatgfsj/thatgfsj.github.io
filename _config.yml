# ============================
# Jekyll 配置 — 个人主页 / 工作站
# ============================
title: "Thatgfsj 个人主页"
tagline: "全栈开发者 · 工具链 · AI 工程"
title_separator: "·"
description: "Thatgfsj（孙政）的个人主页。全栈开发者，折腾工具链、自动化流程与 AI 工程，业余给常用开源仓库提 PR。"
author: "Thatgfsj (孙政)"
avatar: "/assets/img/avatar.png"
repository: "Thatgfsj/thatgfsj.github.io"

# 社交
github_username: "Thatgfsj"
url: "https://www.thatgfsj.xyz"
baseurl: ""

# 页面永久链接
permalink: /blog/:year/:month/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 排除无关文件
exclude:
  - README.md
  - CLAUDE_COPY.md
  - .codegraph/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata

# Markdown
markdown: kramdown
highlighter: rouge

# 语言与时区
lang: zh-CN
timezone: Asia/Shanghai

# 默认 front matter
defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      permalink: /blog/:year/:month/:title/
      image: /assets/img/og.png
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      image: /assets/img/og.png
